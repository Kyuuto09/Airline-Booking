<!DOCTYPE html>
<html>
<head>
    <title>{{ title|default:"Create Airline" }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Basic styling for Django form elements */
        form p {
            margin-bottom: 1rem;
        }
        form label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 0.25rem;
        }
        form input, form select, form textarea {
            display: block;
            width: 100%;
            border-radius: 0.375rem;
            border-color: #d1d5db;
            border-width: 1px;
            padding: 0.5rem 0.75rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        form input[type="file"] {
            padding: 0.5rem 0;
            border: none;
            box-shadow: none;
        }
        form input:focus, form select:focus, form textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        form .helptext {
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: 0.25rem;
        }

        /* Toast Animation */
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-sm border border-[#e8eaed]">
            <div>
                <h2 class="mt-6 text-center text-3xl font-bold text-[#202124]">
                    {{ title|default:"Add New Airline" }}
                </h2>
                <p class="mt-2 text-center text-sm text-[#5f6368]">
                    Enter airline details
                </p>
            </div>
            
            <form class="mt-8 space-y-6" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                {% for field in form %}
                    <div>
                        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                        {% if field.help_text %}
                        <p class="helptext">{{ field.help_text }}</p>
                        {% endif %}
                        {% for error in field.errors %}
                            <p class="text-red-500 text-xs mt-1">{{ error }}</p>
                        {% endfor %}
                    </div>
                {% endfor %}

                <div class="flex items-center justify-between gap-4 pt-4">
                    <a href="{% url 'admin_airline_list' %}" class="w-full flex justify-center py-3 px-4 border border-[#dadce0] rounded-lg shadow-sm text-sm font-medium text-[#5f6368] bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                        Cancel
                    </a>
                    <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                        Save Airline
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
